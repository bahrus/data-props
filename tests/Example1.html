<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- #include virtual="/imports.html" -->
    <be-hive>
        <script type=emc-parser 
                src="be-hive/parsers/parse-pattern-statements.js" 
                parser-name=parse-pattern-statements></script>
        <script type=emc 
                src="data-props/emc.json" 
                wait-for-parsers=parse-pattern-statements></script>
    </be-hive>
    <script type=module>
        import 'be-hive/be-hive.js';
    </script>
</head>
<body>
    <label>
        a: <input id=a>
    </label>
    <label>
        b: <input id=b type=checkbox>
    </label>
    <label>
        c: <input id=c type=number>
    </label>
    <label>
        d: <input id=d type=date>
    </label>
    <div id=div data-props="#a. #b. #c. #d."></div>
    <div id=target></div>
    <script>
        function runTest(){
            if(div.dataset.b === 'false'){
                target.setAttribute('mark', 'good');
            }
        }
        setTimeout(() => {
            runTest();
        }, 500);
    </script>
</body>
</html>
